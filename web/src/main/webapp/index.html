<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  /* Die Seite selbst scrollt nie – auch nicht, wenn auf dem iPhone die Tastatur aufgeht. */
  body { position: fixed; inset: 0; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* Unsichtbares Messelement: liefert die Sicherheitsränder (Notch, Home-Indikator) an das Spiel. */
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Ladebildschirm: reines Schwarz wie der Startbildschirm des iPhones und der erste Frame des Intros. Nur wenn das
     Laden ungewöhnlich lange dauert, erscheint nach einer Sekunde ein ruhiger Punkt. */
  #boot { position: fixed; inset: 0; background: #000; z-index: 10; transition: opacity .35s ease; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot i {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 56px); width: 6px; height: 6px;
    margin-left: -3px; border-radius: 50%; background: #00E5FF; opacity: 0;
    animation: boot-dot 1.6s ease-in-out 1s infinite;
  }
  @keyframes boot-dot { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: .55; transform: scale(1); } }
</style>

<body>
<canvas id="game" tabindex="0"></canvas>
<div id="safe"></div>
<div id="boot"><i></i></div>
<noscript><p style="color:#0ff;font:16px sans-serif;position:fixed;top:40%;width:100%;text-align:center;z-index:11">
Neon TD braucht JavaScript.</p></noscript>
<script>
  // „App installieren“ (Android/Chromium): Das Ereignis kommt oft schon beim Laden – hier abfangen, das Spiel holt es
  // sich später für seinen eigenen Knopf.
  window.__ntdInstall = { deferred: null, installed: false };
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__ntdInstall.deferred = e; });
  window.addEventListener('appinstalled', function () { window.__ntdInstall.deferred = null; window.__ntdInstall.installed = true; });
  // Falls der Browser beim Fokussieren eines Eingabefelds doch scrollt: sofort zurück, das Bild bleibt stehen.
  function ntdNoScroll() { if (window.scrollX || window.scrollY) { window.scrollTo(0, 0); } }
  window.addEventListener('scroll', ntdNoScroll, { passive: true });
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', ntdNoScroll); }
  // iPhone: Pinch-Zoom, Doppeltipp-Zoom und Scroll-Gummiband unterbinden (das Spiel verwaltet die Gesten selbst).
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  // Offline-Fähigkeit (nur über https oder localhost verfügbar)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
