<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
    -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
  }
  /* Die Seite selbst scrollt nie – auch nicht, wenn auf dem iPhone die Tastatur aufgeht. */
  body { position: fixed; inset: 0; }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* Unsichtbares Messelement: liefert die Sicherheitsränder (Notch, Home-Indikator) an das Spiel. */
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  /* Ladebildschirm: reines Schwarz wie der Startbildschirm des iPhones und der erste Frame des Intros. Nur wenn das
     Laden ungewöhnlich lange dauert, erscheint nach einer Sekunde ein ruhiger Punkt. */
  #boot { position: fixed; inset: 0; background: #000; z-index: 10; transition: opacity .35s ease; }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot i {
    position: absolute; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 56px); width: 6px; height: 6px;
    margin-left: -3px; border-radius: 50%; background: #00E5FF; opacity: 0;
    animation: boot-dot 1.6s ease-in-out 1s infinite;
  }
  @keyframes boot-dot { 0%, 100% { opacity: 0; transform: scale(.6); } 50% { opacity: .55; transform: scale(1); } }
  /* Unterstützen-Sheet (Ko-fi): schwebt im Neon-Look über dem Spielfeld, von unten eingeschoben. */
  #support {
    position: fixed; inset: 0; z-index: 8; display: flex; align-items: flex-end; justify-content: center;
    background: rgba(0, 0, 0, .55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; pointer-events: none; transition: opacity .25s ease;
    font-family: -apple-system, "SF Pro Text", "Inter", system-ui, sans-serif; color: #fff;
  }
  #support.on { opacity: 1; pointer-events: auto; }
  #support .card {
    width: 100%; max-width: 480px; max-height: calc(100% - env(safe-area-inset-top) - 24px);
    box-sizing: border-box; padding: 18px 18px calc(env(safe-area-inset-bottom) + 18px);
    display: flex; flex-direction: column; gap: 14px;
    background: #0a0a0f; border-radius: 26px 26px 0 0;
    border: 1px solid rgba(0, 229, 255, .35); border-bottom: 0;
    box-shadow: 0 0 0 1px rgba(0, 229, 255, .08), 0 0 36px rgba(0, 229, 255, .22), 0 -18px 60px rgba(0, 0, 0, .7);
    transform: translateY(100%); transition: transform .32s cubic-bezier(.2, .8, .2, 1);
  }
  @media (min-width: 560px) { #support { align-items: center; } #support .card { border-radius: 26px; border-bottom: 1px solid rgba(0, 229, 255, .35); } }
  #support.on .card { transform: none; }
  #support .head { display: flex; align-items: center; gap: 14px; }
  #support .cup {
    flex: none; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center;
    background: rgba(255, 214, 10, .12); border: 1px solid rgba(255, 214, 10, .5); color: #FFD60A;
    box-shadow: 0 0 18px rgba(255, 214, 10, .35), inset 0 0 12px rgba(255, 214, 10, .12);
  }
  #support .cup svg { width: 24px; height: 24px; }
  #support h2 { margin: 0; font-size: 20px; font-weight: 700; letter-spacing: .01em; text-shadow: 0 0 14px rgba(0, 229, 255, .35); }
  #support p { margin: 2px 0 0; font-size: 13.5px; line-height: 1.35; color: rgba(255, 255, 255, .6); }
  #support .x {
    margin-left: auto; flex: none; width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255, 255, 255, .18);
    background: rgba(255, 255, 255, .06); color: #fff; display: grid; place-items: center; font-size: 20px; line-height: 1;
  }
  #support .frame {
    position: relative; height: min(600px, 62vh); border-radius: 18px; overflow: hidden;
    background: #111117; border: 1px solid rgba(255, 255, 255, .1);
  }
  #support .frame .wait { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: rgba(255, 255, 255, .55); font-size: 14px; }
  #support .frame .wait svg { width: 28px; height: 28px; color: #FFD60A; animation: support-steam 1.6s ease-in-out infinite; }
  @keyframes support-steam { 0%, 100% { transform: translateY(0); opacity: .7; } 50% { transform: translateY(-3px); opacity: 1; } }
  #support iframe { position: relative; display: block; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .4s ease; }
  #support .frame.loaded iframe { opacity: 1; }
  #support .frame.loaded .wait { display: none; }
  #support .ext {
    align-self: center; display: inline-flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 999px;
    border: 1px solid rgba(0, 229, 255, .45); color: #00E5FF; text-decoration: none; font-size: 14px; font-weight: 600;
    box-shadow: 0 0 14px rgba(0, 229, 255, .2);
  }
</style>

<body>
<canvas id="game" tabindex="0"></canvas>

<div id="support" hidden>
  <div class="card" role="dialog" aria-modal="true" aria-labelledby="support-title">
    <div class="head">
      <span class="cup" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M7.5 2.5c0 1.5 1.5 1.5 1.5 3S7.5 7 7.5 8.5M11.5 2.5c0 1.5 1.5 1.5 1.5 3s-1.5 1.5-1.5 3"/></svg></span>
      <div><h2 id="support-title">Einen Kaffee?</h2><p>Neon TD bleibt kostenlos. Ein Kaffee hilft beim Weiterbauen.</p></div>
      <button type="button" class="x" aria-label="Schließen">×</button>
    </div>
    <div class="frame"><span class="wait"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9h12v6a5 5 0 0 1-5 5H9a5 5 0 0 1-5-5zM16 11h1.5a2.5 2.5 0 0 1 0 5H16"/><path d="M7.5 2.5c0 1.5 1.5 1.5 1.5 3S7.5 7 7.5 8.5M11.5 2.5c0 1.5 1.5 1.5 1.5 3s-1.5 1.5-1.5 3"/></svg>Ko-fi lädt …</span></div>
    <a class="ext" target="_blank" rel="noopener">Auf ko-fi.com öffnen ↗</a>
  </div>
</div>
<noscript><p style="color:#0ff;font:16px sans-serif;position:fixed;top:40%;width:100%;text-align:center;z-index:11">
Neon TD braucht JavaScript.</p></noscript>
<script>
  // „App installieren“ (Android/Chromium): Das Ereignis kommt oft schon beim Laden – hier abfangen, das Spiel holt es
  // sich später für seinen eigenen Knopf.
  window.__ntdInstall = { deferred: null, installed: false };
  window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.__ntdInstall.deferred = e; });
  window.addEventListener('appinstalled', function () { window.__ntdInstall.deferred = null; window.__ntdInstall.installed = true; });
  // Falls der Browser beim Fokussieren eines Eingabefelds doch scrollt: sofort zurück, das Bild bleibt stehen.
  function ntdNoScroll() { if (window.scrollX || window.scrollY) { window.scrollTo(0, 0); } }
  window.addEventListener('scroll', ntdNoScroll, { passive: true });
  if (window.visualViewport) { window.visualViewport.addEventListener('resize', ntdNoScroll); }
  // iPhone: Pinch-Zoom, Doppeltipp-Zoom und Scroll-Gummiband unterbinden (das Spiel verwaltet die Gesten selbst).
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  // Unterstützen-Sheet: wird vom Spiel (Java) über window.ntdSupport(url, embed) geöffnet.
  (function () {
    var root = document.getElementById('support');
    var frame = root.querySelector('.frame');
    var iframe = null;
    function close() {
      root.classList.remove('on');
      setTimeout(function () { if (!root.classList.contains('on')) { root.hidden = true; if (iframe) { iframe.remove(); iframe = null; frame.classList.remove('loaded'); } } }, 320);
    }
    root.addEventListener('click', function (e) { if (e.target === root) { close(); } });
    root.querySelector('.x').addEventListener('click', close);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && root.classList.contains('on')) { close(); } });
    window.ntdSupport = function (url, embed) {
      root.querySelector('.ext').href = url;
      if (!iframe) {
        iframe = document.createElement('iframe');
        iframe.title = 'Ko-fi';
        iframe.referrerPolicy = 'no-referrer-when-downgrade';
        iframe.addEventListener('load', function () { frame.classList.add('loaded'); });
        iframe.src = embed;
        frame.appendChild(iframe);
      }
      root.hidden = false;
      requestAnimationFrame(function () { requestAnimationFrame(function () { root.classList.add('on'); }); });
    };
  })();
  // Offline-Fähigkeit (nur über https oder localhost verfügbar)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
