<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<title>Neon TD</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="description" content="Neon-Tower-Defense mit Level-Editor – spielbar im Browser und auf dem iPhone.">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Neon TD">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/favicon.png">
<style>
  html, body {
    margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden;
    overscroll-behavior: none; touch-action: none;
    -webkit-user-select: none; user-select: none;
    -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent;
  }
  canvas { position: fixed; left: 0; top: 0; width: 100%; height: 100%; display: block; touch-action: none; outline: none; }
  /* Unsichtbares Messelement: liefert die Sicherheitsränder (Notch, Home-Indikator) an das Spiel. */
  #safe {
    position: fixed; left: 0; top: 0; width: 0; height: 0; visibility: hidden; pointer-events: none;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  #boot {
    position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: #000; color: #0ff; z-index: 10; transition: opacity .5s ease;
    font: 700 clamp(28px, 8vw, 64px)/1 ui-monospace, Menlo, Consolas, monospace; letter-spacing: .2em;
    text-shadow: 0 0 12px #0ff, 0 0 32px #08f;
  }
  #boot.done { opacity: 0; pointer-events: none; }
  #boot small { display: block; margin-top: 1.4em; font-size: 12px; letter-spacing: .3em; color: #f3c; text-shadow: 0 0 8px #f3c; }
</style>
</head>
<body>
<canvas id="game" tabindex="0"></canvas>
<div id="safe"></div>
<div id="boot">NEON TD<small>LÄDT …</small></div>
<noscript><p style="color:#0ff;font:16px sans-serif;position:fixed;top:40%;width:100%;text-align:center;z-index:11">
Neon TD braucht JavaScript.</p></noscript>
<script>
  // iPhone: Pinch-Zoom, Doppeltipp-Zoom und Scroll-Gummiband unterbinden (das Spiel verwaltet die Gesten selbst).
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (t) {
    document.addEventListener(t, function (e) { e.preventDefault(); });
  });
  document.addEventListener('touchmove', function (e) { e.preventDefault(); }, { passive: false });
  // Offline-Fähigkeit (nur über https oder localhost verfügbar)
  if ('serviceWorker' in navigator && location.protocol !== 'file:') {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
</script>
<script src="game.js?v=@BUILD_ID@"></script>
<script>main();</script>
</body>
</html>
