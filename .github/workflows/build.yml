name: Build und Veröffentlichung

# Baut bei jedem Push und Pull Request, führt alle Tests aus und legt die Web-Version sowie die Desktop-Version
# als herunterladbare Artefakte ab. Auf dem Haupt-Branch wird die Web-Version zusätzlich auf GitHub Pages
# veröffentlicht (einmalig aktivieren: Repository → Settings → Pages → Source: "GitHub Actions").

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bauen und testen (Core-Tests, Web-Version mit TeaVM, Desktop-Paket)
        run: ./gradlew --no-daemon build

      - name: Testberichte hochladen (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: '**/build/reports/tests/'

      - name: Web-Version als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: neon-td-web
          path: web/build/dist

      - name: Desktop-Version als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: neon-td-desktop
          path: desktop/build/distributions/*.zip

      - name: Seite für GitHub Pages vorbereiten
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
