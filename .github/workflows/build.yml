name: deps-cache
on:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Alle Abhängigkeiten auflösen (voller Build inkl. Tests)
        run: ./gradlew --no-daemon build -x :desktop:distZip
      - name: Gradle-Cache packen
        run: tar czf gradle-modules.tgz -C ~/.gradle caches/modules-2
      - uses: actions/upload-artifact@v4
        with:
          name: gradle-modules
          path: gradle-modules.tgz
