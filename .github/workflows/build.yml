name: Build und Veröffentlichung

# Baut bei jedem Push und Pull Request, führt alle Tests (auch einen Browser-Test der Web-Version) aus und legt die
# Web-Version sowie die Desktop-Version als herunterladbare Artefakte ab. Auf dem Standard-Branch des Repositories (egal wie er heißt) wird die
# Web-Version zusätzlich auf GitHub Pages veröffentlicht.
# Einmalig aktivieren: Repository → Settings → Pages → Source: "GitHub Actions"
# (bis dahin überspringt der Schritt "deploy" die Veröffentlichung mit einer Warnung; nach dem Aktivieren
# genügt "Re-run all jobs" oder ein neuer Push).

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bauen und testen (Core-Tests, Web-Version mit TeaVM, Desktop-Paket)
        run: ./gradlew --no-daemon build

      - name: Testberichte hochladen (nur bei Fehlern)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: testberichte
          path: '**/build/reports/tests/'

      - name: Web-Version als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: neon-td-web
          path: web/build/dist

      - name: Desktop-Version als Artefakt
        uses: actions/upload-artifact@v4
        with:
          name: neon-td-desktop
          path: desktop/build/distributions/*.zip

      - name: Seite für GitHub Pages vorbereiten
        if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/build/dist

  # Spielt die gebaute Web-Version in echtem Chromium durch (Handy-Layouts, Speichern/Fortsetzen, Cloud-Abgleich gegen
  # ein nachgebautes GitHub). Fängt Fehler ab, die nur im JavaScript-Build auftreten – die Veröffentlichung wartet darauf.
  browser-test:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: neon-td-web
          path: web/build/dist

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Playwright und Chromium installieren
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium

      - name: Browser-Test
        run: node scripts/web-smoke.mjs web-smoke-out

      - name: Screenshots des Browser-Tests hochladen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-screenshots
          path: web-smoke-out

  deploy:
    if: github.ref_name == github.event.repository.default_branch && github.event_name != 'pull_request'
    needs: [build, browser-test]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Ist GitHub Pages aktiviert?
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/pages")
          if [ "$code" = "404" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages ist noch nicht aktiviert::Einmalig unter Settings → Pages → Source 'GitHub Actions' wählen, danach diesen Lauf mit 'Re-run all jobs' wiederholen."
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - id: deployment
        if: steps.check.outputs.enabled == 'true'
        uses: actions/deploy-pages@v4
